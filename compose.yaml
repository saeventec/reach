# Starts the whole Reach system with Docker Compose. Run it with "task dev".
# Each entry under "services" becomes one container.
# Start order: postgres (healthy) → postgres-setup (finished) →
# hello-migrate and auth-migrate (finished) → hello and auth. chat starts
# after postgres-setup.
# nats, web and gateway start right away. Open http://localhost:8080.
# Learn more: docs/learn/docker-compose.md

services:
  # The database. Learn more: docs/learn/postgresql.md
  postgres:
    image: postgres:18.6
    environment:
      # ${...} is filled in from the .env file. ":?" stops with this
      # message if the setting is missing.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (run "task setup")}
    ports:
      # Let database tools on your computer (like the VS Code PostgreSQL
      # extension) connect at localhost:5432. 127.0.0.1 means only your own
      # computer can reach it, not other devices on your network.
      # Learn more: docs/learn/postgresql.md#connect-from-your-computer
      - "127.0.0.1:5432:5432"
    volumes:
      # Keep the data in a named volume, so it survives when the container
      # is removed. Postgres 18 images keep their data in this folder.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # pg_isready comes with Postgres. It succeeds once the database
      # accepts connections.
      test: ["CMD", "pg_isready", "--username=postgres"]
      # While starting (the first 30 seconds), check every second instead
      # of every 30 seconds, so the next containers don't wait long.
      start_period: 30s
      start_interval: 1s

  # Creates each service's database and user if they are missing, then
  # exits. It runs postgres/setup.sql with psql, which comes with the
  # Postgres image. Learn more: docs/learn/postgresql.md#one-user-per-service
  postgres-setup:
    image: postgres:18.6
    # Replace the image's normal program (the database server) with psql.
    # --host is the service name above: inside Compose, containers find
    # each other by name.
    entrypoint: ["psql", "--host=postgres", "--username=postgres", "--file=/setup/setup.sql"]
    environment:
      # psql reads the superuser's password from PGPASSWORD.
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # setup.sql gives these passwords to the hello, auth and chat users.
      HELLO_DATABASE_PASSWORD: ${HELLO_DATABASE_PASSWORD:?Set HELLO_DATABASE_PASSWORD in .env (see .env.example)}
      AUTH_DATABASE_PASSWORD: ${AUTH_DATABASE_PASSWORD:?Set AUTH_DATABASE_PASSWORD in .env (see .env.example)}
      CHAT_DATABASE_PASSWORD: ${CHAT_DATABASE_PASSWORD:?Set CHAT_DATABASE_PASSWORD in .env (see .env.example)}
    volumes:
      # Share the postgres/ folder (with setup.sql), read-only.
      - ./postgres:/setup:ro
    depends_on:
      postgres:
        condition: service_healthy

  # NATS: the "post office" between services. A service publishes an event
  # (like "a message was sent") and every service that subscribed gets it.
  # JetStream, built into NATS, also keeps the events on disk. Nothing uses
  # it yet: chat and realtime come next. Learn more: docs/learn/nats.md
  nats:
    # The Alpine variant includes a shell and wget, for the health check.
    # The default "nats" image contains only the server program.
    image: nats:2.15.2-alpine3.22
    # Arguments for nats-server. They replace the image's default
    # configuration file, which doesn't turn JetStream on.
    # -js: turn JetStream on. -sd: keep its data in /data.
    # -m: serve the monitoring pages (and /healthz) on port 8222.
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      # The monitoring pages, for you to look at in the browser:
      # http://localhost:8222. Only your own computer can reach them.
      # Services connect on port 4222, inside Compose only.
      - "127.0.0.1:8222:8222"
    volumes:
      # Keep JetStream's events between restarts, like postgres-data.
      - nats-data:/data
    healthcheck:
      # /healthz answers 200 once the server (and JetStream) is ready.
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8222/healthz"]
      start_period: 30s
      start_interval: 1s

  # Applies the hello database migrations once, then exits.
  hello-migrate:
    build: ./services/hello/migrations
    environment:
      GOOSE_DRIVER: postgres
      # The database address: user hello, with its password, on the
      # "postgres" container, database hello.
      GOOSE_DBSTRING: postgres://hello:${HELLO_DATABASE_PASSWORD}@postgres:5432/hello?sslmode=disable
    depends_on:
      # Start only after the hello user and database exist.
      postgres-setup:
        condition: service_completed_successfully

  hello:
    build:
      # The whole repo is the build context, so the Dockerfile can also copy
      # the shared code in packages/go. Learn more: docs/learn/docker.md#the-build-context
      context: .
      dockerfile: services/hello/Dockerfile
    environment:
      # The same database address as hello-migrate uses.
      DATABASE_URL: postgres://hello:${HELLO_DATABASE_PASSWORD}@postgres:5432/hello?sslmode=disable
    # No "ports": the browser reaches the hello service only through the
    # gateway. Inside Compose, the gateway finds it as hello:8080.
    # Docker calls /healthz regularly and shows the result in
    # "docker compose ps" as healthy or unhealthy. wget comes with Alpine.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/healthz"]
      # Check every second while starting, like postgres above.
      start_period: 30s
      start_interval: 1s
    # Compose Watch: Go code must be compiled, so a change rebuilds the
    # image and replaces the container. Learn more: docs/learn/docker-compose.md#compose-watch
    develop:
      watch:
        - action: rebuild
          path: ./services/hello
          ignore:
            - migrations/ # applied by hello-migrate, not part of this image's program
        # The shared code is part of this program too.
        - action: rebuild
          path: ./packages/go
    depends_on:
      # Start only after the migrations finished without an error.
      hello-migrate:
        condition: service_completed_successfully

  # Applies the auth database migrations once, then exits. Like hello-migrate.
  auth-migrate:
    build: ./services/auth/migrations
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://auth:${AUTH_DATABASE_PASSWORD}@postgres:5432/auth?sslmode=disable
    depends_on:
      postgres-setup:
        condition: service_completed_successfully

  # Accounts, login, sessions and devices. Learn more: services/auth/main.go
  auth:
    build:
      # Like hello: the whole repo, for packages/go.
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      DATABASE_URL: postgres://auth:${AUTH_DATABASE_PASSWORD}@postgres:5432/auth?sslmode=disable
      # ":-true" means: use true if .env doesn't set it.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    # Like hello: no "ports", and a health check on /healthz.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/healthz"]
      start_period: 30s
      start_interval: 1s
    develop:
      watch:
        - action: rebuild
          path: ./services/auth
          ignore:
            - migrations/ # applied by auth-migrate, not part of this image's program
        # The shared code is part of this program too.
        - action: rebuild
          path: ./packages/go
    depends_on:
      # Start only after the migrations finished without an error.
      auth-migrate:
        condition: service_completed_successfully

  # Conversations and messages (milestone 3). Learn more: services/chat/main.go
  chat:
    build:
      # Like hello: the whole repo, for packages/go.
      context: .
      dockerfile: services/chat/Dockerfile
    environment:
      DATABASE_URL: postgres://chat:${CHAT_DATABASE_PASSWORD}@postgres:5432/chat?sslmode=disable
    # No "ports", on purpose: chat trusts the X-User-Id header, which only
    # the gateway may set (ADR 0029). With a published port, anyone could
    # call chat directly and pretend to be any user.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/healthz"]
      start_period: 30s
      start_interval: 1s
    develop:
      watch:
        - action: rebuild
          path: ./services/chat
        # The shared code is part of this program too.
        - action: rebuild
          path: ./packages/go
    depends_on:
      # Start only after the chat user and database exist. (Its migrations
      # come with its first tables.)
      postgres-setup:
        condition: service_completed_successfully

  # The web app's development server (Vite). Reached through the gateway.
  web:
    build: ./apps/web
    # Compose Watch (started by "task dev"): keep the container up to date
    # while you edit. Learn more: docs/learn/docker-compose.md#compose-watch
    develop:
      watch:
        # Copy changed files into the running container. Vite notices and
        # updates the page in the browser. .dockerignore applies, so
        # node_modules is never copied.
        - action: sync
          path: ./apps/web
          target: /app
        # New libraries need a new image (npm ci runs in the Dockerfile).
        - action: rebuild
          path: ./apps/web/package-lock.json

  # The gateway (Caddy): the only service your browser talks to.
  # Open http://localhost:8080. Learn more: docs/learn/caddy.md
  gateway:
    image: caddy:2.11.7-alpine
    ports:
      # "host:container". Port 8080 on your computer forwards to port 80 in
      # the container. 127.0.0.1 means only your own computer can reach it,
      # not other devices on your network.
      - "127.0.0.1:8080:80"
    volumes:
      # Share the gateway/ folder (with the Caddyfile) with the container,
      # read-only (":ro"). Caddy's docs say to share the folder, not the
      # file alone, so edits to the file are always seen.
      - ./gateway:/etc/caddy:ro

# Named volumes: storage that Docker manages, kept between restarts.
volumes:
  postgres-data:
  nats-data:

// What the realtime service sends to the browser on its WebSocket. Each
// WebSocket message is one ServerEvent, as JSON text (the same JSON the
// Connect APIs use). The browser sends nothing on it.
// Learn more: docs/learn/websocket.md
syntax = "proto3";

package realtime.v1;

import "chat/v1/events.proto";

// ServerEvent is one live update. Exactly one field of "event" is set; the
// browser checks which one. New kinds of updates become new fields.
message ServerEvent {
  oneof event {
    // A message was sent in one of your conversations.
    chat.v1.MessageSent message_sent = 1;
    // Someone's delivered or read watermark moved in one of your
    // conversations: update the ✓ and ✓✓ marks.
    chat.v1.ReceiptUpdated receipt_updated = 2;
    // You are in a new conversation: someone started a chat or a group
    // with you (or you did, on another device).
    chat.v1.ConversationCreated conversation_created = 3;
  }
}

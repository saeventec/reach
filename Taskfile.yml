# All common project commands live here. Run "task" to list them.
# Learn more: docs/learn/task.md

version: "3"

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list

  setup:
    desc: Install the tool versions from .mise.toml
    cmds:
      - mise install

  test:
    desc: Run the tests of the hello service
    dir: services/hello # run the commands inside this folder
    cmds:
      - go test ./...

# All common project commands live here. Run "task" to list them.
# Learn more: docs/learn/task.md

version: "3"

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list

  setup:
    desc: Install the tools and libraries, and create your local .env file
    cmds:
      - mise install
      - task: create-env # run the task below
      # Install the web app's libraries on your computer too, so your editor
      # can check the code. (The container installs its own copy.)
      - npm ci --prefix apps/web
      # Turn on the checks that run before each git commit (lefthook.yml).
      - lefthook install

  create-env:
    internal: true # a helper: hidden from "task --list"
    # "status" decides if the task is already done: if every command here
    # succeeds, Task skips it. So an existing .env is never overwritten.
    status:
      - test -f .env
    cmds:
      - cp .env.example .env

  dev:
    desc: Build and start the whole system (Ctrl+C stops it)
    cmds:
      # --build rebuilds the images, so your latest code changes are used.
      # --watch keeps the web app and the hello service up to date while you
      # edit (Compose Watch).
      - docker compose up --build --watch

  generate:
    desc: Check the .proto files and generate code from them
    cmds:
      - buf lint
      - buf generate

  lint:
    desc: Check all code for likely bugs and formatting (changes nothing)
    cmds:
      - task: lint:go
      - task: lint:web
      - task: lint:proto

  lint:go:
    desc: Check the Go code
    dir: services/hello
    cmds:
      - golangci-lint run ./...

  lint:web:
    desc: Check the web app's code (Oxlint) and formatting (Prettier)
    dir: apps/web
    cmds:
      - npm run lint
      - npm run format:check

  lint:proto:
    desc: Check the .proto files and their formatting (buf)
    cmds:
      - buf lint
      # --diff shows what would change; --exit-code fails if anything would.
      - buf format --diff --exit-code

  format:
    desc: Format all code the standard way (changes files)
    cmds:
      - task: format:go
      - task: format:web
      - task: format:proto

  format:go:
    desc: Format the Go code
    dir: services/hello
    cmds:
      - golangci-lint fmt ./...

  format:web:
    desc: Format the web app's code (Prettier)
    dir: apps/web
    cmds:
      - npm run format

  format:proto:
    desc: Format the .proto files (buf)
    cmds:
      - buf format --write

  build:
    desc: Build the web app and all container images (checks that everything compiles)
    cmds:
      # tsc type-checks the code, then Vite bundles it into apps/web/dist.
      - npm run build --prefix apps/web
      - docker compose build

  test:
    desc: Run all tests (the hello service and the web app)
    cmds:
      # -C and --prefix run each command inside the given folder.
      - go -C services/hello test ./...
      - npm test --prefix apps/web

# All common project commands live here. Run "task" to list them.
# Learn more: docs/learn/task.md

version: "3"

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list

  setup:
    desc: Install the tools and libraries, and create your local .env file
    cmds:
      - mise install
      - task: create-env # run the task below
      # Install the web app's libraries on your computer too, so your editor
      # can check the code. (The container installs its own copy.)
      - npm ci --prefix apps/web
      # Turn on the checks that run before each git commit (lefthook.yml).
      - lefthook install

  create-env:
    internal: true # a helper: hidden from "task --list"
    # "status" decides if the task is already done: if every command here
    # succeeds, Task skips it. So an existing .env is never overwritten.
    status:
      - test -f .env
    cmds:
      - cp .env.example .env

  dev:
    desc: Build and start the whole system (Ctrl+C stops it)
    cmds:
      # --build rebuilds the images, so your latest code changes are used.
      # --watch keeps the web app and the Go services up to date while you
      # edit (Compose Watch).
      - docker compose up --build --watch

  stop:
    desc: Stop the whole system and remove its containers (your data is kept)
    cmds:
      # "down" stops and removes the containers and Compose's network. The
      # next "task dev" creates them again. Named volumes (the database's
      # data) are kept: only "down --volumes" would delete them.
      - docker compose down

  generate:
    desc: Generate code from the .proto files (buf) and the SQL queries (sqlc)
    cmds:
      - buf lint
      - buf generate
      - cd services/auth && sqlc generate
      - cd services/chat && sqlc generate

  lint:
    desc: Check all code for likely bugs and formatting (changes nothing)
    cmds:
      - task: lint:go
      - task: lint:web
      - task: lint:proto

  lint:go:
    desc: Check the Go code
    cmds:
      # Each service is its own Go module, so it is checked from its own
      # folder. Each command runs on its own, so a "cd" doesn't carry over
      # to the next line.
      - cd packages/go && golangci-lint run ./...
      - cd services/hello && golangci-lint run ./...
      - cd services/auth && golangci-lint run ./...
      - cd services/chat && golangci-lint run ./...
      - cd services/realtime && golangci-lint run ./...

  lint:web:
    desc: Check the web app's code (Oxlint) and formatting (Prettier)
    dir: apps/web
    cmds:
      - npm run lint
      - npm run format:check

  lint:proto:
    desc: Check the .proto files and their formatting (buf)
    cmds:
      - buf lint
      # --diff shows what would change; --exit-code fails if anything would.
      - buf format --diff --exit-code

  format:
    desc: Format all code the standard way (changes files)
    cmds:
      - task: format:go
      - task: format:web
      - task: format:proto

  format:go:
    desc: Format the Go code
    cmds:
      - cd packages/go && golangci-lint fmt ./...
      - cd services/hello && golangci-lint fmt ./...
      - cd services/auth && golangci-lint fmt ./...
      - cd services/chat && golangci-lint fmt ./...
      - cd services/realtime && golangci-lint fmt ./...

  format:web:
    desc: Format the web app's code (Prettier)
    dir: apps/web
    cmds:
      - npm run format

  format:proto:
    desc: Format the .proto files (buf)
    cmds:
      - buf format --write

  build:
    desc: Build the web app and all container images (checks that everything compiles)
    cmds:
      # tsc type-checks the code, then Vite bundles it into apps/web/dist.
      - npm run build --prefix apps/web
      - docker compose build

  test:
    desc: Run all tests (the shared Go code, the Go services and the web app). Needs Docker running.
    cmds:
      # The auth service's integration tests start a Postgres in Docker
      # (docs/learn/testing.md#integration-tests).
      # -C and --prefix run each command inside the given folder.
      - go -C packages/go test ./...
      - go -C services/hello test ./...
      - go -C services/auth test ./...
      - go -C services/chat test ./...
      - go -C services/realtime test ./...
      - npm test --prefix apps/web

  test:e2e:
    desc: Run the end-to-end tests in a real browser, against a fresh copy of the whole system. Needs Docker running.
    vars:
      # The test system: its own Compose project, with the changes in
      # compose.e2e.yaml (an empty database, the gateway on port 8180).
      # Learn more: docs/learn/playwright.md#the-test-system
      E2E_COMPOSE: docker compose -p reach-e2e -f compose.yaml -f apps/web/e2e/compose.e2e.yaml
    cmds:
      # Download the browser Playwright drives, if it isn't there yet.
      - npx --prefix apps/web playwright install chromium
      # "defer" runs this at the end, also when a test fails: stop the
      # test system and delete its volumes, so the next run starts empty.
      - defer: "{{.E2E_COMPOSE}} down --volumes"
      # --wait: return only when every service is running and healthy
      # (and the migrations have finished).
      - "{{.E2E_COMPOSE}} up --build --wait"
      - npm run test:e2e --prefix apps/web

  test:race:
    desc: Run realtime's tests with Go's race detector. Needs a C compiler (on WSL2, "sudo apt install gcc").
    cmds:
      # -race watches for two goroutines touching the same memory without a
      # lock. realtime's hub is used by many goroutines at once. It is not
      # part of "task test", because it needs a C compiler, which a new WSL2
      # computer doesn't have. CI runs it. Learn more: docs/learn/websocket.md#the-race-detector
      - go -C services/realtime test -race ./...

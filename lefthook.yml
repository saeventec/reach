# Lefthook runs these checks before each "git commit". If one fails, the
# commit stops, so you can fix the problem first ("task format" fixes the
# formatting). Learn more: docs/learn/lefthook.md
#
# Each job runs only when the commit contains files that match its "glob".

# Load .lefthookrc first, so the project's tools are found, also when git is
# run by your editor instead of your terminal.
# The "./" matters: the hook runs in "sh", and on Linux and WSL2 that is
# often dash, which only looks for a bare file name in the PATH folders,
# not in the current folder.
rc: ./.lefthookrc

pre-commit:
  jobs:
    - name: go
      glob:
        - "services/**/*.go"
        - "packages/**/*.go"
      run: task lint:go

    - name: web
      # Lefthook's "**" means one or more folders, so the files directly in
      # apps/web/ need their own pattern.
      glob:
        - "apps/web/*"
        - "apps/web/**/*"
      run: task lint:web

    - name: proto
      glob: "proto/**/*.proto"
      run: task lint:proto

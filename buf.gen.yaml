# Tells "buf generate" which code to generate from proto/, and where to put it.
# Run it with "task generate". Learn more: docs/learn/protobuf.md
version: v2

# Delete the old generated files first, so files for removed .proto files
# don't stay behind.
clean: true

# "Managed mode" sets language options (like the Go import path) here,
# so the .proto files stay free of Go-specific settings.
managed:
  enabled: true
  override:
    # All Go code goes into the shared module packages/go, because services
    # also use each other's APIs: chat calls auth, realtime reads chat's
    # events (ADR 0017). A folder in proto/, like hello/v1, becomes the Go
    # package .../packages/go/gen/hello/v1.
    - file_option: go_package_prefix
      value: github.com/saeventec/reach/packages/go/gen

# The generators. "local" means they run on your computer (installed by
# mise), not on buf's cloud service.
plugins:
  - local: protoc-gen-go # Go types for the messages
    out: packages/go/gen
    opt: paths=source_relative # mirror the folders of proto/
  - local: protoc-gen-connect-go # Go code for the Connect services
    out: packages/go/gen
    opt: paths=source_relative
  # TypeScript for the web app: messages and services in one file. This
  # generator is an npm package of the web app (installed by "task setup"),
  # so its version always matches the @bufbuild/protobuf library it needs.
  - local: apps/web/node_modules/.bin/protoc-gen-es
    out: apps/web/src/gen
    opt:
      - target=ts # generate .ts files (the default is .js plus type files)
      # Write Protobuf enums as plain objects ("as const") instead of
      # TypeScript "enum", which our tsconfig forbids (erasableSyntaxOnly:
      # only TypeScript that can simply be erased, leaving JavaScript).
      # Marked "experimental" by protoc-gen-es. Learn more: docs/learn/protobuf.md#typescript
      - erasable_syntax=true

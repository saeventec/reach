# Tells "buf generate" which code to generate from proto/, and where to put it.
# Run it with "task generate". Learn more: docs/learn/protobuf.md
version: v2

# Delete the old generated files first, so files for removed .proto files
# don't stay behind.
clean: true

# "Managed mode" sets language options (like the Go import path) here,
# so the .proto files stay free of Go-specific settings.
managed:
  enabled: true
  override:
    # Each service's Go code lives inside that service's own Go module.
    # "path" is a folder inside proto/.
    - file_option: go_package_prefix
      path: hello
      value: github.com/saeventec/reach/services/hello/gen
    # auth's Protobuf code goes into gen/proto, because sqlc writes into
    # gen/queries: "clean" empties each "out" folder, and must not delete
    # sqlc's code.
    - file_option: go_package_prefix
      path: auth
      value: github.com/saeventec/reach/services/auth/gen/proto

# The generators. "local" means they run on your computer (installed by
# mise), not on buf's cloud service. Each Go service only gets the code for
# its own API: "types" keeps only that Protobuf package.
plugins:
  - local: protoc-gen-go # Go types for the messages
    out: services/hello/gen
    opt: paths=source_relative # mirror the folders of proto/
    types: [hello.v1]
  - local: protoc-gen-connect-go # Go code for the Connect service
    out: services/hello/gen
    opt: paths=source_relative
    types: [hello.v1]
  - local: protoc-gen-go
    out: services/auth/gen/proto
    opt: paths=source_relative
    types: [auth.v1]
  - local: protoc-gen-connect-go
    out: services/auth/gen/proto
    opt: paths=source_relative
    types: [auth.v1]
  # TypeScript for the web app: messages and services in one file. This
  # generator is an npm package of the web app (installed by "task setup"),
  # so its version always matches the @bufbuild/protobuf library it needs.
  # The web app talks to every service, so it gets all the APIs.
  - local: apps/web/node_modules/.bin/protoc-gen-es
    out: apps/web/src/gen
    opt: target=ts # generate .ts files (the default is .js plus type files)
